[project]
name = "krishimitra-scheduler"
version = "0.1.0"
description = "Scheduled background jobs for KrishiMitra-AI."
requires-python = ">=3.13,<3.14"
dependencies = [
    "celery>=5.5.3,<6.0.0",
    "redis>=6.4.0,<7.0.0",
    "krishimitra-core",
]

[project.scripts]
krishimitra-scheduler = "krishimitra_scheduler.main:main"

[tool.uv]
package = true

[tool.uv.sources]
krishimitra-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishimitra_scheduler"]