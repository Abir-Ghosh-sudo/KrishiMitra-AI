[project]
name = "krishimitra-api"
version = "0.1.0"
description = "FastAPI application for the KrishiMitra-AI agricultural platform."
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi>=0.116.1,<1.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishimitra_api"]