[project]
name = "krishimitra-soil"
version = "0.1.0"
description = "Soil report parsing, nutrient analysis, soil health assessment, and agricultural soil recommendations for KrishiMitra-AI."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11.7,<3.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishimitra_soil"]