[project]
name = "krishimitra-database"
version = "0.1.0"
description = "Database models, sessions, repositories, migrations, PostgreSQL, PostGIS, and persistence infrastructure for KrishiMitra-AI."
requires-python = ">=3.13,<3.14"

dependencies = [
    "sqlalchemy>=2.0.43,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "alembic>=1.16.4,<2.0.0",
    "geoalchemy2>=0.18.0,<1.0.0",
    "pydantic>=2.11.7,<3.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishimitra_database"]