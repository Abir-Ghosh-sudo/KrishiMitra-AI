[project]
name = "krishimitra-core"
version = "0.1.0"
description = "Shared core configuration, logging, exceptions, types, constants, and utilities for KrishiMitra-AI."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishimitra_core"]