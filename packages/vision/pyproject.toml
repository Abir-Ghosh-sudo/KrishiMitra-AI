[project]
name = "krishimitra-vision"
version = "0.1.0"
description = "Computer vision preprocessing, crop identification, disease and pest analysis, severity estimation, and confidence scoring for KrishiMitra-AI."
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.3.2,<3.0.0",
    "pillow>=11.3.0,<12.0.0",
    "opencv-python-headless>=4.12.0.88,<5.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishimitra_vision"]