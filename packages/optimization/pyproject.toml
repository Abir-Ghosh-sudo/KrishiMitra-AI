[project]
name = "krishimitra-optimization"
version = "0.1.0"
description = "Agricultural resource optimization for irrigation, energy, fertilizer, cost, yield, and sustainability."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11.7,<3.0.0",
    "numpy>=2.3.2,<3.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishimitra_optimization"]