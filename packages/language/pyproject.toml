[project]
name = "krishimitra-language"
version = "0.1.0"
description = "Multilingual language detection, normalization, translation, agricultural terminology, and locale support for KrishiMitra-AI."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11.7,<3.0.0",
    "langdetect>=1.0.9,<2.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishimitra_language"]