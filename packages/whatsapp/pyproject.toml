[project]
name = "krishimitra-whatsapp"
version = "0.1.0"
description = "WhatsApp integration, webhook, messaging, media, and idempotency support for KrishiMitra-AI."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11.7,<3.0.0",
    "httpx>=0.28.1,<1.0.0",
    "krishimitra-core",
    "krishimitra-contracts",
    "krishimitra-security",
    "krishimitra-events",
]

[tool.uv]
package = true

[tool.uv.sources]
krishimitra-core = { workspace = true }
krishimitra-contracts = { workspace = true }
krishimitra-security = { workspace = true }
krishimitra-events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishimitra_whatsapp"]