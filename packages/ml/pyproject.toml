[project]
name = "krishimitra-ml"
version = "0.1.0"
description = "Machine learning models, training, inference, evaluation, feature engineering, and agricultural prediction infrastructure for KrishiMitra-AI."
requires-python = ">=3.13,<3.14"

dependencies = [
    "numpy>=2.3.2,<3.0.0",
    "pandas>=2.3.2,<3.0.0",
    "scikit-learn>=1.7.1,<2.0.0",
    "pydantic>=2.11.7,<3.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishimitra_ml"]