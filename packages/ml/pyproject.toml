[project]
name = "krishimitra-ml"
version = "0.1.0"
description = "Production machine-learning services for KrishiMitra-AI."
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.3.2,<3.0.0",
    "pillow>=11.3.0,<12.0.0",
]

[tool.uv]
package = true

[tool.uv.sources]
krishimitra-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishimitra_ml"]