[project]
name = "krishimitra-documents"
version = "0.1.0"
description = "Document parsing, PDF processing, OCR, structured extraction, chunking, and validation for KrishiMitra-AI."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11.7,<3.0.0",
    "pypdf>=6.0.0,<7.0.0",
    "pillow>=11.3.0,<12.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishimitra_documents"]