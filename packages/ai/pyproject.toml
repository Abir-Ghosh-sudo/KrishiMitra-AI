[project]
name = "krishimitra-ai-engine"
version = "0.1.0"
description = "AI orchestration, LLM, multimodal reasoning, and agricultural prompt infrastructure for KrishiMitra-AI."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11.7,<3.0.0",
    "httpx>=0.28.1,<1.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishimitra_ai"]