[project]
name = "krishimitra-cache"
version = "0.1.0"
description = "Caching, distributed locking, idempotency, and Redis infrastructure for KrishiMitra-AI."
requires-python = ">=3.13,<3.14"

dependencies = [
    "redis>=6.4.0,<7.0.0",
    "pydantic>=2.11.7,<3.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishimitra_cache"]